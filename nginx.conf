server {
    listen 80;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # a tela nao pode ser aberta dentro de outro site; o navegador nao "adivinha" tipo de arquivo
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # index.html nunca fica guardado no navegador: depois de cada atualizacao todo mundo ja abre a
    # tela nova (os arquivos .js/.css tem o hash no nome, esses podem ficar guardados)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /api {
        proxy_pass http://backend_fozesc:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # o IP de quem acessa, para o backend (limite de pedidos por pessoa, nao por escritorio)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
